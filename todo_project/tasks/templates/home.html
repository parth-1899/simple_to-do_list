<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
</head>
<body>

<h2>My To-Do List</h2>

<form method="POST">
    {% csrf_token %}
    <input type="text" name="title" placeholder="Enter task">
    <button type="submit">Add Task</button>
</form>

<ul>
{% for task in tasks %}
    <li>
    {% if task.completed %}
        <strike>{{ task.title }}</strike>
    {% else %}
        {{ task.title }}
    {% endif %}
    <a href="/complete/{{ task.id }}">✔</a>
    <a href="/delete/{{ task.id }}">❌</a>
    </li>
{% endfor %}
</ul>

</body>
</html>
